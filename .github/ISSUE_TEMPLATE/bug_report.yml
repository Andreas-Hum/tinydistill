name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Security problems go through the private process in SECURITY.md instead.
  - type: textarea
    id: env
    attributes:
      label: Output of `tinydistill env`
      description: Run `tinydistill env` and paste its output (versions, platform, CUDA and GPU).
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: >-
        The command you ran (or the Python code), cut down to the smallest version that still fails. The task
        file goes in the next field.
      render: shell
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task file
      description: The task YAML, shortened if it is long.
      render: yaml
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Include the full error message or traceback.
    validations:
      required: true
