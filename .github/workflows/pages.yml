name: Demo

# Publishes demo/ (a static page that runs a distilled model in the browser) to GitHub Pages, after opening it
# in Chromium to check that the model runs and the "Inside the model" view fills in.
on:
  push:
    branches: [main]
    paths: ["demo/**", "tests/browser/check_page.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 --bind 127.0.0.1 -d demo &
          node tests/browser/check_page.mjs http://127.0.0.1:8000/ demo.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-screenshot
          path: demo.png
          if-no-files-found: ignore

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
