name: Docs and demo

# Publishes the documentation (MkDocs) at the site root and demo/ (a static page that runs a distilled model in
# the browser) at /demo/, after building the docs strictly and opening the demo in Chromium to check that the
# model runs and the "Inside the model" view fills in.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "demo/**"
      - "src/**"
      - "RESULTS.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "examples/**/*.md"
      - "tests/browser/check_page.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install (the CLI reference is generated from the code, so the package is needed)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[docs]"
      - name: Build the docs
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict --site-dir site
      - name: Add the demo
        run: cp -r demo site/demo
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Open the demo in Chromium
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
          python -m http.server 8000 --bind 127.0.0.1 -d site &
          node tests/browser/check_page.mjs http://127.0.0.1:8000/demo/ demo.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: demo-screenshot
          path: demo.png
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
