name: CI

# Every push and pull request: lint; the tests on Linux (three Python versions), macOS and Windows; the tests on
# the oldest supported dependency versions; the built package installed as users get it; and the web page in a
# real browser. Weekly, the same with the newest dependency releases, to catch upstream changes early. The
# release workflow runs all of this before publishing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CUDA_VISIBLE_DEVICES: ""
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.5"
      - run: ruff check .
      - run: ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - run: mypy

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v4.3.0, the tiny test models from the Hugging Face Hub
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('tests/**/*.py') }}
          restore-keys: hf-${{ runner.os }}-
      - name: Install (CPU-only torch)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then pip install torch; else
            pip install torch --index-url https://download.pytorch.org/whl/cpu; fi
          pip install -e ".[dev]"
      - run: pytest -q

  oldest:
    name: test (oldest supported dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-oldest-${{ hashFiles('tests/**/*.py') }}
          restore-keys: hf-oldest-
      - name: Install the lower bounds from pyproject.toml
        run: |
          pip install "torch==2.6.*" --index-url https://download.pytorch.org/whl/cpu
          # sentencepiece: transformers 4.x needs it to convert the tiny Mistral test model's tokenizer
          pip install "numpy==1.24.*" "transformers==4.56.*" "onnx==1.15.*" "onnxruntime==1.17.*" \
            "pyyaml==6.0.*" "datasets==2.18.*" "matplotlib==3.7.*" pytest sentencepiece protobuf
          pip install --no-deps -e .
          pip list | grep -iE "^(torch|numpy|transformers|onnx|onnxruntime|datasets|matplotlib) "
      - run: pytest -q

  package:
    name: package (built wheel, installed as users get it)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: The wheel's version matches pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          ls dist/tinydistill-$version-py3-none-any.whl dist/tinydistill-$version.tar.gz
      - name: Install the wheel (not the source tree)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "$(ls dist/*.whl)[hf]" pytest
      - name: The installed package works
        run: |
          cd "$RUNNER_TEMP"
          tinydistill --help > /dev/null
          python -c "import tinydistill as t; print(t.__version__, t.__file__); assert 'site-packages' in t.__file__"
      - name: End-to-end test against the installed package
        run: pytest -q tests/test_cli.py -k "end_to_end or python_pipeline" -p no:cacheprovider

  docs:
    name: docs build (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[docs]"
      - run: mkdocs build --strict --site-dir site
        env:
          NO_MKDOCS_2_WARNING: "1"

  browser:
    name: web page in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
      - run: |
          python tests/browser/build_tiny_site.py site
          python tests/browser/build_tiny_site.py site-multi --multi
      - name: Open the pages in Chromium
        run: |
          python -m http.server 8000 --bind 127.0.0.1 -d site &
          python -m http.server 8001 --bind 127.0.0.1 -d site-multi &
          node tests/browser/check_page.mjs http://127.0.0.1:8000/simple/ page.png
          NO_EXPLAIN=1 node tests/browser/check_page.mjs http://127.0.0.1:8001/
          node tests/browser/check_explainer.mjs http://127.0.0.1:8000/ \
            http://127.0.0.1:8000/explainer-multi/ --shot explainer.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: browser-screenshot
          path: |
            page.png
            explainer.png
          if-no-files-found: ignore
