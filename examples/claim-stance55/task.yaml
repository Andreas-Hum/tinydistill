# Claim Stance (CS55) from the FewMany benchmark (Yehudai and Bandel, 2024; arXiv 2404.12365):
# https://huggingface.co/datasets/FastFit/claim_stance_55, built from the claims of Bar-Haim et al. (2017).
# Claims from Wikipedia that support or contest a debate topic, 55 topics; 1,675 training and 480 test claims,
# no validation split. Between 3 and 131 training claims per topic, and 53 of the topics occur in the test
# set. The gold label is the topic itself, as the dataset writes it; it is also the label's name.
name: claim-stance55
text_field: text
label_field: label
prompt: |-
  Here is a claim made in a debate. Which debate topic is it about?
  Options:
  {labels}
  {examples}

  Claim: {text}

  Reply with one option, exactly as written.
