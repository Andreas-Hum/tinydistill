# Amazon Products (AP106) from the FewMany benchmark (Yehudai and Bandel, 2024; arXiv 2404.12365):
# https://huggingface.co/datasets/FastFit/ap_106. An Amazon product's title and description, 106 product
# categories (department, then category); 22,036 training, 2,459 validation and 6,148 test texts. The
# categories are very unevenly common (1,547 training texts for the most common, 1 for the rarest), and only
# 84 of them occur in the test set. Each label id is the dataset's "Department | Category" string; its name
# writes it "Department: Category".
name: ap106
text_field: text
label_field: label
prompt: |-
  Here is a product's title and description from an online shop. Which product category does it belong to?
  Options:
  {labels}
  {examples}

  Product: {text}

  Reply with one option, exactly as written.
