# AG News (Zhang et al., 2015): https://huggingface.co/datasets/fancyzhx/ag_news. News articles in four topics;
# the ids are the dataset's own label names, and the values are what the teacher answers with. The same task as
# the "your own task" notebook. No descriptions: with them (with-descriptions.yaml), Qwen2.5-1.5B-Instruct
# answered "world" for nearly every article; `tinydistill tune` found this (tune-1.5b.md).
name: ag-news
text_field: text
label_field: label
prompt: |-
  Here is a news headline with the start of the article. What is it about?
  Options:
  {labels}

  News: {text}

  Reply with one option, exactly as written.
labels:
  World: world
  Sports: sports
  Business: business
  Sci/Tech: science and technology
