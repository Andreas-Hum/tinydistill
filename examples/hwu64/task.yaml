# HWU64 (Liu et al., 2019): https://huggingface.co/datasets/DeepPavlov/hwu64. Requests to a home assistant in
# English, 64 intents; 8,954 training and 1,076 test texts. The gold labels are intent indices, in the order of
# the dataset's "intents" config, which the labels below follow. Label names are the intent ids made readable,
# as in examples/massive-da/task.yaml (each id stays the label's id).
name: hwu64
text_field: utterance
label_field: label
prompt: |-
  Here is a request someone said to their home assistant. Which intent does it express?
  Options:
  {labels}
  {examples}

  Request: {text}

  Reply with one option, exactly as written.
labels:
- alarm_query: alarm query
- alarm_remove: alarm remove
- alarm_set: alarm set
- audio_volume_down: volume down
- audio_volume_mute: volume mute
- audio_volume_up: volume up
- calendar_query: calendar query
- calendar_remove: calendar remove
- calendar_set: calendar set
- cooking_recipe: cooking recipe
- datetime_convert: time zone convert
- datetime_query: date or time query
- email_addcontact: email add contact
- email_query: email query
- email_querycontact: email query contact
- email_sendemail: email send
- general_affirm: affirm
- general_commandstop: stop
- general_confirm: confirm
- general_dontcare: don't care
- general_explain: explain
- general_joke: joke
- general_negate: negate
- general_praise: praise
- general_quirky: chit-chat
- general_repeat: repeat
- iot_cleaning: robot vacuum
- iot_coffee: coffee machine
- iot_hue_lightchange: lights change colour
- iot_hue_lightdim: lights dim
- iot_hue_lightoff: lights off
- iot_hue_lighton: lights on
- iot_hue_lightup: lights brighter
- iot_wemo_off: smart plug off
- iot_wemo_on: smart plug on
- lists_createoradd: list create or add
