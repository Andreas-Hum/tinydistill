# Argument Topic (AT71) from the FewMany benchmark (Yehudai and Bandel, 2024; arXiv 2404.12365):
# https://huggingface.co/datasets/FastFit/argument_topic_71, built from the arguments of Gretz et al. (2020).
# Arguments written for or against a debatable topic, 71 topics; 6,640 training, 949 validation and 1,898
# test arguments; every topic has between 37 and 161 training arguments. The gold label is the topic itself,
# as the dataset writes it; it is also the label's name.
name: argument-topic71
text_field: text
label_field: label
prompt: |-
  Here is an argument from a debate. Which topic is it arguing about?
  Options:
  {labels}
  {examples}

  Argument: {text}

  Reply with one option, exactly as written.
