# MASSIVE (FitzGerald et al., 2022; CC BY 4.0), Danish (da-DK): https://huggingface.co/datasets/mteb/amazon_massive_intent,
# config "da". Requests to a voice assistant in Danish, 60 intents. The instruction and the label names are in
# English and the texts in Danish; the student is compared as an English and a multilingual encoder.
# Label names are the dataset's intent ids made readable (each id stays the label's id).
name: massive-da
text_field: text
label_field: label
prompt: |-
  Here is a request someone said to their voice assistant, in Danish. Which intent does it express?
  Options:
  {labels}
  {examples}

  Request: {text}

  Reply with one option, exactly as written.
labels:
- alarm_query: alarm query
- alarm_remove: alarm remove
- alarm_set: alarm set
- audio_volume_down: volume down
- audio_volume_mute: volume mute
- audio_volume_other: volume other
- audio_volume_up: volume up
- calendar_query: calendar query
- calendar_remove: calendar remove
- calendar_set: calendar set
- cooking_query: cooking query
- cooking_recipe: cooking recipe
- datetime_convert: time zone convert
- datetime_query: date or time query
- email_addcontact: email add contact
- email_query: email query
- email_querycontact: email query contact
- email_sendemail: email send
- general_greet: greeting
- general_joke: joke
- general_quirky: chit-chat
- iot_cleaning: robot vacuum
- iot_coffee: coffee machine
- iot_hue_lightchange: lights change colour
- iot_hue_lightdim: lights dim
- iot_hue_lightoff: lights off
- iot_hue_lighton: lights on
- iot_hue_lightup: lights brighter
- iot_wemo_off: smart plug off
- iot_wemo_on: smart plug on
- lists_createoradd: list create or add
- lists_query: list query
- lists_remove: list remove
- music_dislikeness: music dislike
- music_likeness: music like
- music_query: music query
- music_settings: music settings
- news_query: news query
- play_audiobook: play audiobook
- play_game: play game
- play_music: play music
- play_podcasts: play podcast
- play_radio: play radio
- qa_currency: currency question
- qa_definition: definition question
- qa_factoid: factual question
- qa_maths: maths question
- qa_stock: stock price question
- recommendation_events: recommend events
- recommendation_locations: recommend places
- recommendation_movies: recommend movies
- social_post: social media post
- social_query: social media query
- takeaway_order: takeaway order
- takeaway_query: takeaway query
- transport_query: transport query
- transport_taxi: taxi
- transport_ticket: transport ticket
- transport_traffic: traffic
- weather_query: weather query
