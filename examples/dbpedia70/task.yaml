# DBpedia, level 2 (DB70), from the FewMany benchmark (Yehudai and Bandel, 2024; arXiv 2404.12365):
# https://huggingface.co/datasets/FastFit/dbpedia_70. The opening of a Wikipedia article, classed by the
# second level of the DBpedia ontology, 70 classes; 240,942 training, 36,003 validation and 60,794 test
# articles. The classes are very unevenly common (31,111 training articles for the most common, 129 for the
# rarest). The gold label is the class name as the dataset writes it; it is also the label's name.
name: dbpedia70
text_field: text
label_field: label
prompt: |-
  Here is the opening of a Wikipedia article. What type of thing is the article about?
  Options:
  {labels}
  {examples}

  Article: {text}

  Reply with one option, exactly as written.
