[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tinydistill"
version = "0.6.1"
description = "Distil an LLM classification prompt into a small, fast model that runs on a CPU."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Andreas-Hum" }]
keywords = ["knowledge distillation", "llm", "text classification", "onnx", "inference"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.6",
  "numpy>=1.24",
  "transformers>=4.56",
  "onnx>=1.15",
  "onnxruntime>=1.17",
  "pyyaml>=6",
]

[project.optional-dependencies]
hf = ["datasets>=2.18"]
4bit = ["bitsandbytes>=0.43", "accelerate>=0.30"]
plot = ["matplotlib>=3.7"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "datasets>=2.18", "build>=1.2", "matplotlib>=3.7"]

[project.scripts]
tinydistill = "tinydistill.cli:main"

[project.urls]
Homepage = "https://github.com/Andreas-Hum/tinydistill"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/tinydistill"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/tinydistill/web.py" = ["E501"]  # the embedded HTML/CSS page
"src/tinydistill/analyse.py" = ["E501"]  # the embedded HTML/CSS page
